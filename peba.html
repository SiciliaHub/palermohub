<script>
// Sync route mappa PEBA (?scheda=...#zoom/lat/lng) tra iframe cross-origin e barra indirizzi
(function() {
    const IFRAME_ORIGIN = 'https://palermohub.github.io';
    const iframe = document.getElementById('main-iframe');

    // All'apertura: inoltra scheda/hash correnti del wrapper all'app dentro l'iframe
    const scheda = new URLSearchParams(window.location.search).get('scheda');
    if (scheda || window.location.hash) {
        const src = new URL(iframe.src);
        if (scheda) src.searchParams.set('scheda', scheda);
        src.hash = window.location.hash;
        iframe.src = src.href;
    }

    // Quando l'app dentro l'iframe cambia scheda/vista, aggiorna la barra indirizzi
    window.addEventListener('message', function(e) {
        if (e.origin !== IFRAME_ORIGIN || !e.data || e.data.type !== 'peba:route') return;
        const url = new URL(window.location.href);
        if (e.data.scheda) url.searchParams.set('scheda', e.data.scheda);
        else url.searchParams.delete('scheda');
        url.hash = e.data.hash || '';
        history.replaceState(null, '', url);
    });
})();

// Gestione layout con header e footer PalermoHub
document.addEventListener('DOMContentLoaded', function() {
    // Leggi parametri URL e crea breadcrumbs
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('mapTitle')) {
        // Il codice creerà automaticamente i breadcrumbs
        if (typeof initMapPageBreadcrumbs === 'function') {
            initMapPageBreadcrumbs();
        }
    }
    
    // Verifica se header e footer sono stati caricati correttamente
    setTimeout(function() {
        const header = document.querySelector('.ph-header');
        const footer = document.querySelector('.ph-footer');
        
        // Se gli elementi PH non sono stati popolati, usa layout alternativo
        if (!header?.innerHTML || !footer?.innerHTML) {
            console.log('Layout PalermoHub non disponibile, uso layout alternativo');
            document.body.classList.add('no-ph-layout');
        }
    }, 1000);
    
    // Esempio di come cambiare il src dell'iframe
    // document.getElementById('main-iframe').src = 'https://example.com';
});	
</script>
