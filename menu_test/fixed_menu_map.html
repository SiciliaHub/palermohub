        /* 1. Menu FAB (Floating Action Button) - CORRETTO */
        .fab-menu {
            position: fixed; /* Cambiato da absolute a fixed */
            bottom: 20px;
            left: 50%; /* Centrato orizzontalmente */
            transform: translateX(-50%); /* Centrato perfettamente */
            z-index: 10001; /* Z-index più alto di Leaflet */

        .fab-main {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #ff9900;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;

            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10002;
        }

        .fab-main:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(255, 153, 0, 0.6);
        }

        .fab-options {
            position: absolute;
            bottom: 70px; /* Sopra il pulsante principale */
            left: 50%;
            transform: translateX(-50%); /* Centrato rispetto al pulsante */
            transform-origin: bottom center; /* Origine dell'animazione al centro */
            transition: all 0.3s ease;
            opacity: 0;
            pointer-events: none;
            z-index: 10001;
            display: flex;
            flex-direction: column-reverse; /* Opzioni dal basso verso l'alto */
            gap: 10px;
        }

        .fab-menu.active .fab-options {
            opacity: 1;
            pointer-events: all;
        }

        .fab-option {
            display: flex;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: white;
            border: 2px solid #ff9900;
            color: #ff9900;
            text-decoration: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            transition: all 0.2s ease;
            position: relative;
            font-size: 12px;
            font-weight: bold;
            z-index: 10001; /* CORRETTO: rimosso il duplicato */
        }

        .fab-option:hover {
            background: #ff9900;
            color: white;
            transform: scale(1.1);
        }

        .fab-option::before {
            content: attr(data-label);
            position: absolute;
            left: 60px; /* Cambiato da right a left per centrare */
            background: #333;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            transform: translateX(-10px);
            transition: all 0.2s ease;
            pointer-events: none;
            z-index: 10003;
        }

        .fab-option:hover::before {
            opacity: 1;
            transform: translateX(0);
        }

        /* Overlay per chiudere i menu */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.3);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 10000; /* Sotto il menu ma sopra la mappa */
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* Assicuriamo che la mappa non interferisca */
        .sidebar-map {
            position: relative;
            z-index: 1;

        <script>
        function toggleFabMenu() {
            console.log('Toggle menu clicked'); // Debug
            const fabMenu = document.getElementById('fabMenu');
            const overlay = document.getElementById('overlay');
            
            if (fabMenu && overlay) {
                fabMenu.classList.toggle('active');
                overlay.classList.toggle('active');
                console.log('Menu toggled:', fabMenu.classList.contains('active')); // Debug
            } else {
                console.error('Elementi del menu non trovati'); // Debug
            }
        }

        function closeAllMenus() {
            console.log('Closing all menus'); // Debug
            const fabMenu = document.getElementById('fabMenu');
            const overlay = document.getElementById('overlay');
            
            if (fabMenu) fabMenu.classList.remove('active');
            if (overlay) overlay.classList.remove('active');
        }

        // Chiudi menu con ESC
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeAllMenus();
            }
        });

        // Debug: verifica che gli elementi esistano al caricamento
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM caricato');
            console.log('FAB Menu:', document.getElementById('fabMenu'));
            console.log('Overlay:', document.getElementById('overlay'));
        });
        </script>
