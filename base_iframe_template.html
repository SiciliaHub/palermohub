    <!-- CSS per iframe tra header e footer -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        /* Layout principale */
        body {
            display: flex;
            flex-direction: column;
        }
        
        /* Header PalermoHub - altezza automatica */
        .ph-header {
            flex-shrink: 0;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            z-index: 1000;
        }
        
        /* Container iframe - occupa tutto lo spazio rimanente */
        .iframe-container {
            flex: 1;
            display: flex;
            width: 100%;
            min-height: 0; /* Importante per il flex */
        }
        
        /* Iframe che riempie il container */
        #main-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        
        /* Footer PalermoHub - altezza automatica */
        .ph-footer {
            flex-shrink: 0;
            background: #f8f9fa;
            border-top: 1px solid #dee2e6;
            z-index: 1000;
        }
        
        /* Nasconde scrollbar */
        ::-webkit-scrollbar {
            display: none;
        }
        
        body {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Layout di fallback se gli script PH non caricano */
        .fallback-header {
            height: 60px;
            background: #343a40;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 20px;
            font-weight: bold;
        }
        
        .fallback-footer {
            height: 50px;
            background: #6c757d;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9em;
        }
    </style>
</head>

<body>
    <!-- Header PalermoHub -->
    <div class="ph-header">
        <!-- Il contenuto dell'header verrà inserito qui dagli script -->
    </div>
    
    <!-- Container per iframe - occupa tutto lo spazio tra header e footer -->
    <div class="iframe-container">
        <iframe id="main-iframe" 
                src="#" 
                title="Contenuto principale"
                allowfullscreen
                loading="lazy">
        </iframe>
    </div>
    
    <!-- Footer PalermoHub -->
    <div class="ph-footer">
        <!-- Il contenuto del footer verrà inserito qui dagli script -->
    </div>

<!-- Inclusione header e footer PalermoHub -->
<link rel="stylesheet" href="lib/css/ph-css.css">
    <script src="lib/js/client/ph-header.js"></script>
    <script src="lib/js/client/ph-footer.js"></script>


<script>
// Gestione layout con header e footer PalermoHub
document.addEventListener('DOMContentLoaded', function() {
    // Leggi parametri URL e crea breadcrumbs
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('mapTitle')) {
        // Il codice creerà automaticamente i breadcrumbs
        if (typeof initMapPageBreadcrumbs === 'function') {
            initMapPageBreadcrumbs();
        }
    }
    
    // Verifica se header e footer sono stati caricati correttamente
    setTimeout(function() {
        const header = document.querySelector('.ph-header');
        const footer = document.querySelector('.ph-footer');
        
        // Se gli elementi PH non sono stati popolati, usa layout alternativo
        if (!header?.innerHTML || !footer?.innerHTML) {
            console.log('Layout PalermoHub non disponibile, uso layout alternativo');
            document.body.classList.add('no-ph-layout');
        }
    }, 1000);
    
    // Esempio di come cambiare il src dell'iframe
    // document.getElementById('main-iframe').src = 'https://example.com';
});	
</script>

</body>
