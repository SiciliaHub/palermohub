name: Sync CSV json from Google Sheet PalermoHub

on:
  schedule:
    # Esegui alle 12:00 e 16:00 UTC (14:00 e 18:00 ora italiana in inverno)
  #  - cron: '35 * * * *'  # Ogni ora al minuto 32
     - cron: '00 12 * * *'  # 12:00 UTC 
   #  - cron: '00 16 * * *'  # 16:00 UTC
  workflow_dispatch: # Permette esecuzione manuale

jobs:
  sync-csv:
    runs-on: ubuntu-latest
    # Esegui solo sul branch PH-release-v2.0
    if: github.ref == 'refs/heads/PH-release-v2.0'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Download CSV from Google Sheet
      run: |
        # URL del tuo Google Sheet
        SHEET_URL="https://docs.google.com/spreadsheets/d/1A-U8JCbH8Rh2PHoIHG2DL3uPNncR8DpGm3_nzBxRbHA/export?format=csv&gid=1491024401"
        
        echo "📄 Scaricamento CSV da Google Sheets..."
        
        # Scarica seguendo redirect con retry
        for i in {1..3}; do
          curl -L -s --fail \
            -H "User-Agent: Mozilla/5.0 (compatible; GitHub-Actions)" \
            -H "Accept: text/csv,application/csv,*/*" \
            -H "Cache-Control: no-cache" \
            "$SHEET_URL" -o new_palermo-hub.csv
            
          if [ $? -eq 0 ] && [ -s new_palermo-hub.csv ]; then
            break
          else
            echo "⚠️ Tentativo $i fallito, riprovo..."
            sleep 5
          fi
        done
        
        # Verifica finale
        if [ ! -s new_palermo-hub.csv ]; then
          echo "❌ Errore: File CSV vuoto dopo tutti i tentativi"
          exit 1
        fi
        
        # Controlla che non sia HTML
        if grep -q -i "<html>\|<head>\|<body>" new_palermo-hub.csv; then
          echo "❌ Errore: Ricevuto HTML invece di CSV"
          echo "📋 Contenuto ricevuto:"
          head -10 new_palermo-hub.csv
          exit 1
        fi
        
        # Validazione CSV base
        LINES=$(wc -l < new_palermo-hub.csv)
        if [ "$LINES" -lt 1 ]; then
          echo "❌ CSV vuoto o invalido"
          exit 1
        fi
        
        echo "✅ CSV scaricato con successo"
        echo "📊 Righe totali: $LINES"
        echo "📋 Prima riga:"
        head -1 new_palermo-hub.csv
        
    - name: Check for changes
      id: changes
      run: |
        # Crea cartella dati-palermo-hub se non esiste
        mkdir -p dati-palermo-hub
        
        if [ -f "dati-palermo-hub/palermo-hub.csv" ]; then
          if cmp -s "dati-palermo-hub/palermo-hub.csv" "new_palermo-hub.csv"; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "📊 Nessuna modifica rilevata"
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "📄 Modifiche rilevate"
          fi
        else
          echo "changes=true" >> $GITHUB_OUTPUT
          echo "🆕 Primo caricamento"
        fi
        
    - name: Generate Maps Metadata JSON
      if: steps.changes.outputs.changes == 'true'
      run: |
        echo "🔄 Generazione maps-metadata.json con parser CSV ultra-robusto..."
        
        # Crea script Node.js con parser CSV che gestisce interruzioni di riga
        cat > generate-metadata.js << 'EOF'
        const fs = require('fs');

        function parseCSVRobust(csvText) {
          const rows = [];
          let currentRow = [];
          let currentCell = '';
          let inQuotes = false;
          let i = 0;
          
          while (i < csvText.length) {
            const char = csvText[i];
            const nextChar = csvText[i + 1];
            
            if (char === '"') {
              if (inQuotes && nextChar === '"') {
                // Escaped quote (doppia virgoletta)
                currentCell += '"';
                i += 2;
                continue;
              } else {
                // Toggle quote state
                inQuotes = !inQuotes;
              }
            } else if (char === ',' && !inQuotes) {
              // End of cell (solo se non siamo dentro virgolette)
              currentRow.push(currentCell.trim());
              currentCell = '';
            } else if ((char === '\n' || char === '\r') && !inQuotes) {
              // End of row (solo se non siamo dentro virgolette)
              if (currentCell.trim() || currentRow.length > 0) {
                currentRow.push(currentCell.trim());
                
                // Aggiungi la riga solo se non è completamente vuota
                if (currentRow.some(cell => cell.length > 0)) {
                  rows.push([...currentRow]);
                }
                
                currentRow = [];
                currentCell = '';
              }
              
              // Salta \r\n combination
              if (char === '\r' && nextChar === '\n') {
                i++;
              }
            } else {
              // Normal character - aggiungi alla cella corrente
              currentCell += char;
            }
            
            i++;
          }
          
          // Aggiungi ultima cella/riga se presente
          if (currentCell.trim() || currentRow.length > 0) {
            currentRow.push(currentCell.trim());
            if (currentRow.some(cell => cell.length > 0)) {
              rows.push(currentRow);
            }
          }
          
          return rows;
        }

        async function generateMetadata() {
          const metadata = {};
          let processedCount = 0;
          let skippedCount = 0;

          console.log('🔄 Inizio parsing CSV con parser ultra-robusto...');
          
          try {
            // Leggi tutto il file CSV come singola stringa
            const csvContent = fs.readFileSync('new_palermo-hub.csv', 'utf8');
            console.log(`📂 File letto: ${csvContent.length} caratteri`);
            
            const rows = parseCSVRobust(csvContent);
            console.log(`📊 Righe parsate: ${rows.length}`);
            
            if (rows.length === 0) {
              throw new Error('Nessuna riga valida trovata nel CSV');
            }
            
            // Prima riga = headers
            const headers = rows[0].map(h => h.toLowerCase().replace(/"/g, '').trim());
            console.log('📋 Headers rilevati:', headers);
            console.log(`📋 Numero colonne: ${headers.length}`);
            
            // Verifica presenza campo URL
            const urlFieldIndex = headers.findIndex(h => h === 'url');
            if (urlFieldIndex === -1) {
              throw new Error('Campo URL non trovato negli headers');
            }
            console.log(`✅ Campo URL trovato all'indice: ${urlFieldIndex}`);
            
            // Statistiche preliminari
            let validRows = 0;
            let invalidRows = 0;
            
            // Prima passata per statistiche
            for (let i = 1; i < rows.length; i++) {
              if (rows[i].length === headers.length) {
                validRows++;
              } else {
                invalidRows++;
              }
            }
            
            console.log(`📈 Righe valide: ${validRows}, Righe con colonne errate: ${invalidRows}`);
            
            // Processa le righe valide
            for (let i = 1; i < rows.length; i++) {
              const values = rows[i];
              
              // Verifica numero colonne
              if (values.length !== headers.length) {
                if (skippedCount < 10) { // Limita i log per evitare spam
                  console.warn(`⚠️  Riga ${i + 1}: ${values.length} colonne invece di ${headers.length} - SALTATA`);
                  if (values.length > 0) {
                    console.warn(`    Contenuto parziale: "${values.slice(0, 2).join(' | ')}..."`);
                  }
                }
                skippedCount++;
                continue;
              }
              
              // Crea oggetto riga
              const row = {};
              headers.forEach((header, index) => {
                row[header] = (values[index] || '').replace(/"/g, '').trim();
              });
              
              // Verifica URL valida
              const urlField = row.url || '';
              if (!urlField || urlField.length < 3) {
                skippedCount++;
                continue;
              }
              
              // Helper functions
              const getFirstItem = (str) => {
                if (!str) return '';
                return str.split(',')[0].trim();
              };
              
              const getTags = (str) => {
                if (!str) return [];
                return str.split(',')
                  .map(tag => tag.trim())
                  .filter(tag => tag.length > 0);
              };
              
              // Pulisci la descrizione da eventuali HTML tags o caratteri speciali
              const cleanDescription = (desc) => {
                if (!desc) return '';
                return desc
                  .replace(/<[^>]*>/g, '') // Rimuovi HTML tags
                  .replace(/\s+/g, ' ')    // Normalizza spazi
                  .trim()
                  .substring(0, 200);     // Limita lunghezza
              };
              
              // Crea metadata entry
              metadata[urlField] = {
                titolo: row.titolo || '',
                categoria: getFirstItem(row.categoria),
                territorio: getFirstItem(row.territorio),
                autore: getFirstItem(row.collaborazione),
                anno: row.anno || '',
                tags: getTags(row.tag),
                fonte: getFirstItem(row.fontedati),
                descrizione: cleanDescription(row.descrizione)
              };
              
              processedCount++;
              
              if (processedCount % 25 === 0) {
                console.log(`📈 Processate ${processedCount} righe...`);
              }
            }
            
            console.log(`\n✅ Parsing completato:`);
            console.log(`   • Righe totali nel CSV: ${rows.length - 1}`);
            console.log(`   • Righe processate con successo: ${processedCount}`);
            console.log(`   • Righe saltate: ${skippedCount}`);
            console.log(`   • Mappe nel metadata finale: ${Object.keys(metadata).length}`);
            
            if (Object.keys(metadata).length === 0) {
              throw new Error('Nessuna mappa valida processata - controlla il formato CSV');
            }
            
            // Salva il file JSON
            const outputPath = 'dati-palermo-hub/maps-metadata.json';
            fs.writeFileSync(outputPath, JSON.stringify(metadata, null, 2));
            
            console.log(`\n💾 File salvato: ${outputPath}`);
            
            // Statistiche finali
            const stats = {
              totaleMappe: Object.keys(metadata).length,
              conCategoria: Object.values(metadata).filter(m => m.categoria).length,
              conTerritorio: Object.values(metadata).filter(m => m.territorio).length,
              conAutore: Object.values(metadata).filter(m => m.autore).length,
              conAnno: Object.values(metadata).filter(m => m.anno).length,
              conTags: Object.values(metadata).filter(m => m.tags.length > 0).length
            };
            
            console.log('\n📈 Statistiche finali:', JSON.stringify(stats, null, 2));
            
          } catch (error) {
            console.error('\n❌ Errore critico:', error.message);
            console.error('Stack trace:', error.stack);
            process.exit(1);
          }
        }

        // Avvia la generazione
        generateMetadata();
        EOF
        
        # Esegui script con più dettagli di debug
        echo "🚀 Esecuzione script di generazione metadata..."
        node generate-metadata.js
        
        # Verifica risultato con controlli estesi
        if [ -f "dati-palermo-hub/maps-metadata.json" ]; then
          MAPS_COUNT=$(grep -o '"[^"]*":' dati-palermo-hub/maps-metadata.json | wc -l)
          SIZE=$(ls -lah dati-palermo-hub/maps-metadata.json | awk '{print $5}')
          
          echo "✅ Metadata JSON generato con successo!"
          echo "📊 Mappe nel metadata: $MAPS_COUNT"
          echo "📁 Dimensione file: $SIZE"
          
          # Mostra le prime righe del JSON generato
          echo "🔍 Preview JSON (prime 5 chiavi):"
          head -20 dati-palermo-hub/maps-metadata.json
        else
          echo "❌ ERRORE: File metadata non generato!"
          echo "📋 Contenuti directory:"
          ls -la dati-palermo-hub/
          exit 1
        fi
        
    - name: Backup and update files
      if: steps.changes.outputs.changes == 'true'
      run: |
        # Timestamp italiano (UTC+1 in inverno, UTC+2 in estate)
        DATE=$(date -u +"%Y-%m-%d")
        TIME=$(date -u +"%H-%M")
        HOUR=$(date -u +"%H")
        
        # Crea directory per backup se non esiste
        mkdir -p "backups/$DATE"
        
        # Se esiste il file principale, fai backup
        if [ -f "dati-palermo-hub/palermo-hub.csv" ]; then
          BACKUP_FILE="backups/$DATE/palermo-hub_pa_$TIME.csv"
          if [ ! -f "$BACKUP_FILE" ]; then
            cp "dati-palermo-hub/palermo-hub.csv" "$BACKUP_FILE"
            echo "💾 Backup creato: $BACKUP_FILE"
          fi
        fi
        
        # Se esiste il metadata, fai backup anche di quello
        if [ -f "dati-palermo-hub/maps-metadata.json" ]; then
          BACKUP_META="backups/$DATE/maps-metadata_$TIME.json"
          if [ ! -f "$BACKUP_META" ]; then
            cp "dati-palermo-hub/maps-metadata.json" "$BACKUP_META"
            echo "💾 Backup metadata: $BACKUP_META"
          fi
        fi
        
        # Aggiorna il file principale nella cartella dati-palermo-hub
        mv "new_palermo-hub.csv" "dati-palermo-hub/palermo-hub.csv"
        echo "📄 File principale aggiornato: dati-palermo-hub/palermo-hub.csv"
        
        # Pulisci file temporaneo script
        rm -f generate-metadata.js
        
        # Determina se è l'esecuzione serale (22:30 UTC = ultima della giornata)
        if [ "$HOUR" = "22" ]; then
          echo "🧹 Esecuzione serale - pulizia giornaliera..."
          # Mantieni solo l'ultimo file della giornata
          LATEST_FILE=$(ls -t "backups/$DATE"/palermo-hub_*.csv 2>/dev/null | head -1)
          LATEST_META=$(ls -t "backups/$DATE"/maps-metadata_*.json 2>/dev/null | head -1)
          
          if [ -n "$LATEST_FILE" ]; then
            # Conta quanti file ci sono prima della pulizia
            FILES_BEFORE=$(ls "backups/$DATE"/palermo-hub_*.csv 2>/dev/null | wc -l)
            # Elimina tutti tranne l'ultimo
            find "backups/$DATE" -name "palermo-hub_*.csv" -not -path "$LATEST_FILE" -delete
            echo "✅ Pulizia CSV completata. Mantenuto solo: $(basename "$LATEST_FILE")"
            echo "🗑️ Rimossi $(($FILES_BEFORE - 1)) file CSV precedenti"
          fi
          
          if [ -n "$LATEST_META" ]; then
            # Pulisci anche i metadata
            META_BEFORE=$(ls "backups/$DATE"/maps-metadata_*.json 2>/dev/null | wc -l)
            find "backups/$DATE" -name "maps-metadata_*.json" -not -path "$LATEST_META" -delete
            echo "✅ Pulizia metadata completata. Mantenuto solo: $(basename "$LATEST_META")"
            echo "🗑️ Rimossi $(($META_BEFORE - 1)) file metadata precedenti"
          fi
        else
          echo "📋 Esecuzione pomeridiana - backup mantenuto"
        fi
        
    - name: Commit and push changes
      if: steps.changes.outputs.changes == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        git add .
        git commit -m "📄 Aggiornamento dati PalermoHub: CSV + Metadata JSON $(date -u '+%Y-%m-%d %H:%M UTC')"
        git push
        
        echo "✅ Modifiche salvate su GitHub"
        
        # Log finale
        if [ -f "dati-palermo-hub/maps-metadata.json" ]; then
          MAPS_COUNT=$(grep -o '"[^"]*":' dati-palermo-hub/maps-metadata.json | wc -l)
          echo "🎯 Deploy completato con $MAPS_COUNT mappe nel metadata"
        fi
        
    - name: No changes
      if: steps.changes.outputs.changes == 'false'
      run: |
        echo "ℹ️ Nessuna modifica da salvare"
        rm -f new_palermo-hub.csv