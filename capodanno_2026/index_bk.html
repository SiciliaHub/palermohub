<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chiusure Stradali Capodanno 2026 - Palermo</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #E63946;
            --primary-dark: #B8202C;
            --gold: #F4A100;
            --dark: #1D1D2C;
            --darker: #14141F;
            --light: #F8F9FA;
            --glass: rgba(29, 29, 44, 0.9);
        }
        body { font-family: 'Source Sans Pro', sans-serif; background: var(--darker); color: var(--light); overflow: hidden; }
        #map { width: 100%; height: 100vh; z-index: 1; }
        .header { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: linear-gradient(180deg, #ffffffed, transparent 100%); padding: 20px 30px 40px; pointer-events: none; }
        .header-content { display: flex; align-items: center; gap: 20px; pointer-events: auto; }
        .logo-badge { width: 60px; height: 60px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); border-radius: 12px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(230, 57, 70, 0.4); }
        .logo-badge svg { width: 32px; height: 32px; fill: white; }
        .title-group h1 { font-family: 'Bebas Neue', sans-serif; font-size: 2.2rem; letter-spacing: 2px; color: rgba(29, 29, 44, 0.9); text-shadow: 0 2px 10px rgba(0,0,0,0.5); line-height: 1; }
        .title-group .subtitle { font-size: 0.95rem; color: var(--gold); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .info-panel { position: fixed; bottom: 30px; left: 30px; z-index: 1000; background: var(--glass); backdrop-filter: blur(20px); border-radius: 16px; padding: 24px; max-width: 340px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
        .info-panel h3 { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: 1px; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
        .info-panel h3::before { content: ''; width: 4px; height: 24px; background: var(--primary); border-radius: 2px; }
        .time-block { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .time-row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
        .time-row:last-child { margin-bottom: 0; }
        .time-icon { width: 32px; height: 32px; background: var(--dark); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .time-icon svg { width: 18px; height: 18px; fill: var(--gold); }
        .time-text { flex: 1; }
        .time-label { font-size: 0.75rem; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.5px; }
        .time-value { font-weight: 700; font-size: 1rem; }
        .legend-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid rgba(255,255,255,0.1); }
        .legend-line { width: 40px; height: 6px; background: var(--primary); border-radius: 3px; box-shadow: 0 0 10px rgba(230, 57, 70, 0.5); }
        .legend-line.divieto { background: #ff9900; box-shadow: 0 0 10px rgba(255, 0, 153, 0.5); }
        .stats { display: flex; gap: 16px; margin-top: 16px; }
        .stat-box { flex: 1; background: rgba(255,255,255,0.05); border-radius: 10px; padding: 12px; text-align: center; }
        .stat-number { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: var(--gold); line-height: 1; }
        .stat-label { font-size: 0.7rem; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }
        .map-controls { position: fixed; bottom: 30px; right: 30px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
        .control-btn { width: 48px; height: 48px; background: var(--glass); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s ease; }
        .control-btn:hover { background: var(--primary); transform: scale(1.05); }
        .control-btn svg { width: 22px; height: 22px; fill: white; }
        .street-list-toggle { position: fixed; top: 100px; right: 30px; z-index: 1000; }
        .toggle-btn { background: var(--glass); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px 20px; color: white; font-family: 'Source Sans Pro', sans-serif; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: all 0.3s ease; }
        .toggle-btn:hover { background: var(--primary); }
        .toggle-btn svg { width: 18px; height: 18px; fill: currentColor; }
        .street-panel { position: fixed; top: 150px; right: 30px; bottom: 100px; width: 320px; background: var(--glass); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; z-index: 999; overflow: hidden; display: none; }
        .street-panel.active { display: block; }
        .street-panel-header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .street-panel-header h4 { font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; letter-spacing: 1px; }
        .street-list { padding: 10px; height: calc(100% - 70px); overflow-y: auto; }
        .street-list::-webkit-scrollbar { width: 6px; }
        .street-list::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 3px; }
        .street-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
        .street-item { padding: 12px 14px; border-radius: 10px; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 10px; font-size: 0.9rem; }
        .street-item:hover { background: rgba(255,255,255,0.1); }
        .street-item::before { content: ''; width: 8px; height: 8px; background: var(--primary); border-radius: 50%; flex-shrink: 0; }
        .street-item.not-found::before { background: rgba(255,255,255,0.3); }
        .street-item.not-found { color: rgba(255,255,255,0.4); }
        .leaflet-control-zoom { display: none !important; }
        .leaflet-popup-content-wrapper { background: var(--dark); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .leaflet-popup-content { color: white; font-family: 'Source Sans Pro', sans-serif; margin: 14px 18px; }
        .leaflet-popup-tip { background: var(--dark); }
        .popup-title { font-weight: 700; font-size: 1rem; margin-bottom: 4px; }
        .popup-status { font-size: 0.8rem; color: var(--primary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .custom-marker { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); border-radius: 50%; border: 3px solid white; box-shadow: 0 4px 15px rgba(230, 57, 70, 0.5); display: flex; align-items: center; justify-content: center; }
        .custom-marker svg { width: 20px; height: 20px; fill: white; }
        @media (max-width: 768px) {
            .header { padding: 15px 20px 30px; }
            .logo-badge { width: 50px; height: 50px; }
            .title-group h1 { font-size: 1.6rem; }
            .info-panel { left: 15px; right: 15px; bottom: 15px; max-width: none; padding: 18px; }
            .street-list-toggle { top: 90px; right: 15px; }
            .street-panel { left: 15px; right: 15px; top: 140px; bottom: 200px; width: auto; }
            .map-controls { bottom: auto; top: 90px; right: auto; left: 15px; flex-direction: row; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div class="logo-badge">
                <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
            </div>
            <div class="title-group">
                <h1>Chiusure Stradali Capodanno 2026</h1>
                <div class="subtitle">Comune di Palermo</div>
            </div>
            <img src="img/ods.png" alt="OpenData Sicilia" style="height: 60px; margin-left: auto;">
        </div>
    </div>
    <div id="map"></div>
    <div class="info-panel">
        <h3>Informazioni</h3>
        <div class="time-block">
            <div class="time-row">
                <div class="time-icon"><svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg></div>
                <div class="time-text"><div class="time-label">Inizio chiusura</div><div class="time-value">31/12/2025 ore 07:00</div></div>
            </div>
            <div class="time-row">
                <div class="time-icon"><svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg></div>
                <div class="time-text"><div class="time-label">Fine chiusura</div><div class="time-value">01/01/2026 ore 07:00</div></div>
            </div>
        </div>
        <div class="legend-item"><div class="legend-line"></div><span>Chiusura al transito veicolare</span></div>
        <div class="legend-item"><div class="legend-line divieto"></div><span>Divieto di sosta con rimozione</span></div>
        <div class="stats">
            <div class="stat-box"><div class="stat-number" id="streetCount">0</div><div class="stat-label">Strade</div></div>
            <div class="stat-box"><div class="stat-number">24h</div><div class="stat-label">Durata</div></div>
        </div>
    </div>
    <div class="street-list-toggle">
        <button class="toggle-btn" onclick="toggleStreetPanel()">
            <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
            <span>Elenco Strade</span>
        </button>
    </div>
    <div class="street-panel" id="streetPanel">
        <div class="street-panel-header"><h4>Strade Interessate</h4></div>
        <div class="street-list" id="streetList"></div>
    </div>
    <div class="map-controls">
        <button class="control-btn" onclick="map.zoomIn()" title="Zoom In"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></button>
        <button class="control-btn" onclick="map.zoomOut()" title="Zoom Out"><svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z"/></svg></button>
        <button class="control-btn" onclick="resetView()" title="Reimposta vista"><svg viewBox="0 0 24 24"><path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3c-.46-4.17-3.77-7.48-7.94-7.94V1h-2v2.06C6.83 3.52 3.52 6.83 3.06 11H1v2h2.06c.46 4.17 3.77 7.48 7.94 7.94V23h2v-2.06c4.17-.46 7.48-3.77 7.94-7.94H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg></button>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Funzione per convertire coordinate da EPSG:3857 a WGS84
        function toWGS84(x, y) {
            const R = 6378137;
            const lat = (2 * Math.atan(Math.exp(y / R)) - Math.PI / 2) * (180 / Math.PI);
            const lon = (x / R) * (180 / Math.PI);
            return [lat, lon];
        }

        // Funzione per rilevare se le coordinate sono in EPSG:3857 o WGS84
        function isEPSG3857(coord) {
            // Le coordinate EPSG:3857 sono molto grandi (milioni), WGS84 sono piccole (-180 a 180 per lon, -90 a 90 per lat)
            return Math.abs(coord[0]) > 200 || Math.abs(coord[1]) > 200;
        }

        // Inizializza mappa
        const centerPalermo = [38.1250, 13.3550];
        const map = L.map('map', { zoomControl: false, attributionControl: true }).setView(centerPalermo, 16);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap © CARTO - Rielaborazione dati: @opendatasicilia - @gbvitrano',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        const streetLayers = {};
        const allStreetNames = new Set();
        const allCoords = [];

        // Carica e visualizza dati dai file GeoJSON
        Promise.all([
            fetch('geojson/Chiusura.geojson').then(r => r.json()),
            fetch('geojson/Divieto.geojson').then(r => r.json())
        ]).then(([chiusura, divieto]) => {
            // Processa chiusure al transito (rosso)
            chiusura.features.forEach(feature => {
                const name = feature.properties.Odonimo || feature.properties.UFF_DENOMINAZIONE;
                allStreetNames.add(name);

                feature.geometry.coordinates.forEach(lineString => {
                    // Converti coordinate in base al sistema di riferimento
                    const coords = lineString.map(coord => {
                        if (isEPSG3857(coord)) {
                            // Converti da EPSG:3857 a WGS84 e poi inverti per Leaflet
                            return toWGS84(coord[0], coord[1]);
                        } else {
                            // Già in WGS84, inverti solo [lon, lat] -> [lat, lon]
                            return [coord[1], coord[0]];
                        }
                    });
                    allCoords.push(...coords);

                    // Linea di sfondo
                    L.polyline(coords, {
                        color: '#E63946',
                        weight: 14,
                        opacity: 0.25,
                        lineCap: 'round',
                        lineJoin: 'round'
                    }).addTo(map);

                    // Linea principale
                    const polyline = L.polyline(coords, {
                        color: '#E63946',
                        weight: 6,
                        opacity: 0.9,
                        lineCap: 'round',
                        lineJoin: 'round'
                    }).addTo(map);

                    polyline.bindPopup('<div class="popup-title">' + name + '</div><div class="popup-status">🚫 Chiusura al transito veicolare</div>');

                    if (!streetLayers[name]) streetLayers[name] = [];
                    streetLayers[name].push({ layer: polyline, coords: coords, type: 'chiusura' });
                });
            });

            // Processa divieti di sosta (#ff9900)
            divieto.features.forEach(feature => {
                const name = feature.properties.Odonimo || feature.properties.UFF_DENOMINAZIONE;
                allStreetNames.add(name);

                feature.geometry.coordinates.forEach(lineString => {
                    // Converti coordinate in base al sistema di riferimento
                    const coords = lineString.map(coord => {
                        if (isEPSG3857(coord)) {
                            // Converti da EPSG:3857 a WGS84 e poi inverti per Leaflet
                            return toWGS84(coord[0], coord[1]);
                        } else {
                            // Già in WGS84, inverti solo [lon, lat] -> [lat, lon]
                            return [coord[1], coord[0]];
                        }
                    });
                    allCoords.push(...coords);

                    // Linea di sfondo
                    L.polyline(coords, {
                        color: '#ff9900',
                        weight: 14,
                        opacity: 0.25,
                        lineCap: 'round',
                        lineJoin: 'round'
                    }).addTo(map);

                    // Linea principale
                    const polyline = L.polyline(coords, {
                        color: '#ff9900',
                        weight: 6,
                        opacity: 0.9,
                        lineCap: 'round',
                        lineJoin: 'round'
                    }).addTo(map);

                    polyline.bindPopup('<div class="popup-title">' + name + '</div><div class="popup-status">🚷 Divieto di sosta con rimozione coatta</div>');

                    if (!streetLayers[name]) streetLayers[name] = [];
                    streetLayers[name].push({ layer: polyline, coords: coords, type: 'divieto' });
                });
            });

            // Aggiorna statistiche
            document.getElementById('streetCount').textContent = allStreetNames.size;

            // Marker per il centro eventi
            const markerIcon = L.divIcon({
                html: '<div class="custom-marker" style="width:40px;height:40px;font-size:24px;display:flex;align-items:center;justify-content:center;">🎉</div>',
                className: '',
                iconSize: [40, 40],
                iconAnchor: [20, 20]
            });
            L.marker([38.1243, 13.3547], { icon: markerIcon }).addTo(map).bindPopup('<div class="popup-title">Piazza Castelnuovo</div><div class="popup-status">🎉 Centro Eventi Capodanno 2026</div>');

            // Popola lista strade
            const listEl = document.getElementById('streetList');
            const sortedStreets = Array.from(allStreetNames).sort();
            sortedStreets.forEach(strada => {
                const div = document.createElement('div');
                div.className = 'street-item';

                // Aggiungi icona in base al tipo
                const types = streetLayers[strada].map(l => l.type);
                if (types.includes('chiusura') && types.includes('divieto')) {
                    div.style.setProperty('--dot-color', 'linear-gradient(90deg, #E63946 50%, #ff9900 50%)');
                } else if (types.includes('divieto')) {
                    div.style.borderLeft = '4px solid #ff9900';
                } else {
                    div.style.borderLeft = '4px solid #E63946';
                }

                div.textContent = strada;

                if (streetLayers[strada] && streetLayers[strada].length > 0) {
                    div.onclick = () => {
                        const layers = streetLayers[strada];
                        const midLayer = layers[Math.floor(layers.length / 2)];
                        const midCoord = midLayer.coords[Math.floor(midLayer.coords.length / 2)];
                        map.setView(midCoord, 18);
                        midLayer.layer.openPopup();
                    };
                }
                listEl.appendChild(div);
            });

            // Adatta vista a tutte le strade
            if (allCoords.length > 0) {
                map.fitBounds(L.latLngBounds(allCoords), { padding: [80, 80] });
            }
        }).catch(error => {
            console.error('Errore nel caricamento dei dati:', error);
        });

        function toggleStreetPanel() {
            document.getElementById('streetPanel').classList.toggle('active');
        }

        function resetView() {
            if (allCoords.length > 0) {
                map.fitBounds(L.latLngBounds(allCoords), { padding: [80, 80] });
            }
        }
    </script>
</body>
</html>
